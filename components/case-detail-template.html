<!-- Modèle de structure pour toute nouvelle page située sous /realisations/.
     Reprendre les classes partagées et le body class case-detail-page.
     Conserver le fond commun piloté par .case-detail-page dans css/style.css. -->
<main class="case-detail-main">
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <section class="case-hero portfolio-list-hero">
    <div class="hero-glow hero-glow--blue" aria-hidden="true"></div>
    <div class="hero-glow hero-glow--teal" aria-hidden="true"></div>
    <!-- Utiliser ici l’eyebrow de catégorie, le titre, l’introduction et les tags. Aucun bouton « Visiter le site ». -->
  </section>
  <section class="case-content">
    <div class="container case-two-col">
      <div><div class="section-tag case-section-label">Le projet du client</div></div>
      <div class="case-copy"><p>Présenter ici le projet et le travail réalisé, sans titre secondaire.</p></div>
    </div>
  </section>
  <section class="case-content case-content--alt">
    <div class="container">
      <div class="section-tag case-section-label">Aperçu du site</div>
      <div class="case-gallery case-gallery--showcase">
        <!-- Un aperçu desktop et un aperçu mobile. -->
      </div>
    </div>
  </section>
</main>
